backend:
  name: github
  repo: bekuonen/13x13
  branch: main
  base_url: https://sveltia-auth.bekuonen.workers.dev
media_folder: static/images/uploads
public_folder: /images/uploads
locale: de

collections:
  # --- Ausgaben: ein Editorial-Kopf je Ausgabe ---
  - name: ausgaben
    label: Ausgaben
    label_singular: Ausgabe
    folder: content/ausgaben
    path: "{{slug}}/_index"
    create: true
    fields:
      - {label: "Titel", name: "title", widget: "string", default: "Ausgabe "}
      - {label: "Nummer", name: "nummer", widget: "number", value_type: "int"}
      - {label: "Erscheinungsdatum", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false}
      - {label: "Titelzeile (optional)", name: "titelzeile", widget: "string", required: false}
      - {label: "Entwurf", name: "draft", widget: "boolean", default: true}
      - {label: "Editorial", name: "body", widget: "markdown"}

  # --- Beiträge: liegen in der jeweiligen Ausgabe ---
  - name: beitraege
    label: Beiträge
    label_singular: Beitrag
    folder: content/ausgaben
    path: "{{fields.ausgabe}}/{{slug}}"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Ausgabe", name: "ausgabe", widget: "string", hint: "Nummer des Ausgabe-Ordners, z. B. 01"}
      - {label: "Titel", name: "title", widget: "string"}
      - {label: "Lead", name: "lead", widget: "text"}
      - label: "Thema"
        name: "thema"
        widget: "select"
        options: [Politik, Gesellschaft, Wirtschaft, Kultur, Geschichte, "Natur und Umwelt", Tourismus, Sport, Genuss, Porträt, Ästhetik, Generationen, Glosse]
      - label: "Textformat"
        name: "textformat"
        widget: "select"
        options:
          - {label: "Einschätzung", value: "einschaetzung"}
          - {label: "Reportage", value: "reportage"}
          - {label: "Porträt", value: "portraet"}
          - {label: "Beobachtung", value: "beobachtung"}
          - {label: "Fiktion", value: "fiktion"}
      - label: "Autoren"
        name: "autoren"
        widget: "list"
        field: {label: "Autor", name: "autor", widget: "string"}
      - {label: "Datum", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false}
      - {label: "Entwurf", name: "draft", widget: "boolean", default: true}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Titelbild", name: "featured_image", widget: "image", required: false}
      - label: "Inhalt"
        name: "body"
        widget: "markdown"
        media_library:
          allow_multiple: true

  # --- 13 Empfehlungen ---
  - name: empfehlungen
    label: 13 Empfehlungen
    label_singular: Empfehlung
    folder: content/empfehlungen
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Titel", name: "title", widget: "string"}
      - {label: "Folge", name: "folge", widget: "string", required: false, hint: "z. B. #5"}
      - {label: "Kategorie", name: "kategorie", widget: "string", required: false}
      - {label: "Website", name: "website", widget: "string", required: false}
      - {label: "Hervorgehoben", name: "featured", widget: "boolean", default: false}
      - {label: "Beschreibung", name: "body", widget: "markdown"}

  # --- Autoren ---
  - name: autoren
    label: Autoren
    label_singular: Autor
    folder: content/autoren
    path: "{{slug}}/_index"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Name", name: "title", widget: "string"}
      - {label: "Biografie", name: "bio", widget: "text", required: false}
      - {label: "E-Mail", name: "email", widget: "string", required: false}
      - {label: "Foto", name: "foto", widget: "image", required: false, hint: "Porträtfoto der Autorin / des Autors"}

  # --- Einzelseiten ---
  - name: seiten
    label: Seiten
    files:
      - label: "Standpunkte"
        name: "standpunkte"
        file: "content/standpunkte.md"
        fields:
          - {label: "Titel", name: "title", widget: "string"}
          - {label: "Layout", name: "layout", widget: "hidden", default: "standpunkte"}
      - label: "Empfehlungen – Einleitung"
        name: "empfehlungen_index"
        file: "content/empfehlungen/_index.md"
        fields:
          - {label: "Titel", name: "title", widget: "string"}
          - {label: "Einleitung", name: "body", widget: "markdown"}

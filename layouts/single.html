{{ define "main" }}
{{ if .Params.standpunkte }}
{{ partial "inhalt-standpunkte.html" . }}
{{ else if .Params.grundsaetze }}
{{ partial "inhalt-charta.html" . }}
{{ else if .Params.redaktion_name }}
{{ partial "inhalt-kontakt.html" . }}
{{ else }}
<section class="seite"><div class="schmal">
  <h1>{{ .Title }}</h1>
  <div class="seite-body">{{ .Content }}</div>
</div></section>
{{ end }}
{{ end }}

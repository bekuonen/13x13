{{ if .Site.Params.vorschau }}
<div class="vorschau-banner" id="vorschau-banner">
  <span class="vb-badge">Vorschau</span>
  <span class="vb-text">{{ .Site.Params.vorschau_text }}</span>
  {{ with .Site.Params.launch }}
  <span class="vb-count" data-launch="{{ . }}">
    <span class="vb-num" data-d>–</span><small>Tage</small>
    <span class="vb-num" data-h>–</span><small>Std</small>
    <span class="vb-num" data-m>–</span><small>Min</small>
  </span>
  {{ end }}
  <button class="vb-close" onclick="this.parentElement.remove()" aria-label="Schliessen">&times;</button>
</div>
<script>
(function(){var el=document.getElementById('vorschau-banner');if(!el)return;var c=el.querySelector('.vb-count');if(!c)return;
var t=new Date(c.getAttribute('data-launch')).getTime();
function u(){var x=t-Date.now();if(x<0)x=0;
c.querySelector('[data-d]').textContent=Math.floor(x/864e5);
c.querySelector('[data-h]').textContent=Math.floor(x%864e5/36e5);
c.querySelector('[data-m]').textContent=Math.floor(x%36e5/6e4);}
u();setInterval(u,60000);})();
</script>
{{ end }}

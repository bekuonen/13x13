{{ define "main" }}
<section class="empf"><div class="wrap">
  <h1>{{ .Title }}</h1>
  {{ with .Content }}<div class="empf-intro seite-body">{{ . }}</div>{{ end }}
  <div class="empf-grid">
  {{ range .Pages }}
    <article class="empf-karte">
      {{ with .Params.folge }}<div class="folge">{{ . }}</div>{{ end }}
      <h2>{{ .Title }}</h2>
      <div>{{ .Content }}</div>
      {{ with .Params.website }}<div class="web"><a href="{{ . }}" rel="noopener">Website &rarr;</a></div>{{ end }}
    </article>
  {{ end }}
  </div>
</div></section>
{{ end }}
